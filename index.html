<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner - NagorikPoint</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f4f4; }
        #reader { width: 100%; max-width: 500px; margin: auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: green; }
        .loading { color: orange; font-weight: bold; }
    </style>
</head>
<body>

    <h2>QR কোড স্ক্যানার প্যানেল</h2>
    <div id="reader"></div>
    <div id="result">ক্যামেরা চালু করার অনুমতি দিন...</div>

    <script>
        // আপনার গুগল অ্যাপস স্ক্রিপ্টের WEB APP URL টি এখানে বসান
        const googleWebAppUrl = "আপনার_GOOGLE_WEB_APP_URL_এখানে_দিন";

        function onScanSuccess(decodedText, decodedResult) {
            // সফলভাবে স্ক্যান হলে স্ক্যানার বন্ধ করা (যাতে বারবার রিকোয়েস্ট না যায়)
            html5QrcodeScanner.clear();
            
            document.getElementById('result').innerHTML = `<span class="loading">ডাটা গুগল শিটে পাঠানো হচ্ছে... (${decodedText})</span>`;

            // গুগল অ্যাপস স্ক্রিপ্ট ব্যাকএন্ডে ডাটা পাঠানো (Fetch API)
            fetch(googleWebAppUrl, {
                method: 'POST',
                mode: 'no-cors', // CORS ব্লক এড়াতে no-cors ব্যবহার করা হয়েছে
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    qrCode: decodedText,
                    operator: "Md. Lovlu Islam" // আপনার নাম বা ইউজারের নাম
                })
            })
            .then(() => {
                document.getElementById('result').innerHTML = `✅ সফলভাবে বিতরণ করা হয়েছে: ${decodedText}`;
                // ৩ সেকেন্ড পর স্ক্যানার আবার চালু করার জন্য পেজ রিলোড করা
                setTimeout(() => { location.reload(); }, 3000);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = "❌ ডাটা পাঠাতে সমস্যা হয়েছে। আবার চেষ্টা করুন।";
            });
        }

        // স্ক্যানার কনফিগারেশন এবং চালু করা
        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: { width: 250, height: 250 } }
            );
            html5QrcodeScanner.render(onScanSuccess);
        }

        window.onload = startScanner;
    </script>
</body>
</html>
