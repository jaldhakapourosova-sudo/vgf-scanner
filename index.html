<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QR কোড স্ক্যানার প্যানেল</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { background-color: #f8f9fa; padding: 15px; text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #reader { width: 100%; max-width: 450px; margin: 0 auto; border: 2px solid #28a745; border-radius: 12px; overflow: hidden; background: #000; min-height: 250px; }
    .status-msg { margin-top: 20px; padding: 12px; border-radius: 8px; font-weight: bold; }
    .info { background-color: #e7f3ff; color: #004085; }
    .success { background-color: #d4edda; color: #155724; }
  </style>
</head>
<body>

  <div class="container">
    <h2 class="text-success font-weight-bold mb-4">QR কোড স্ক্যানার প্যানেল</h2>
    
    <!-- ক্যামেরা রেন্ডার করার মেইন এরিয়া -->
    <div id="reader"></div>
    
    <div id="statusText" class="status-msg info">ক্যামেরা চালু করার অনুমতি দিন...</div>
    
    <button onclick="restartScanner()" class="btn btn-outline-success btn-block mt-4 font-weight-bold">
       🔄 ক্যামেরা রি-স্টার্ট করুন
    </button>
  </div>

<script>
  let html5QrCode;

  async function startScanning() {
    const status = document.getElementById("statusText");
    
    // আগের সেশন থাকলে তা পরিষ্কার করা (TypeError সমাধান করবে)
    if (html5QrCode) {
      try {
        await html5QrCode.stop();
        await html5QrCode.clear();
      } catch (err) {
        console.log("Cleanup error:", err);
      }
    }

    html5QrCode = new Html5QrCode("reader");
    
    const config = { 
      fps: 15, 
      qrbox: { width: 250, height: 250 },
      aspectRatio: 1.0 
    };

    // সরাসরি পিছনের ক্যামেরা ট্রাই করা হচ্ছে
    html5QrCode.start(
      { facingMode: "environment" }, 
      config,
      (decodedText) => {
         status.className = "status-msg success";
         status.innerHTML = "✔ সফল স্ক্যান! ডাটা পাঠানো হচ্ছে...";
         
         let cleanNid = decodedText.replace("NID:", "").trim();
         
         if (window.opener) {
            window.opener.postMessage({ type: 'QR_SCAN_SUCCESS', nid: cleanNid }, '*');
         } else {
            alert("মেইন ড্যাশবোর্ড উইন্ডো খুঁজে পাওয়া যায়নি।");
         }

         // ৩ সেকেন্ড হোল্ড করে আবার স্ক্যান শুরু করবে
         html5QrCode.pause(true);
         setTimeout(() => { 
           html5QrCode.resume(); 
           status.className = "status-msg info";
           status.innerHTML = "📷 পরবর্তী স্ক্যানের জন্য প্রস্তুত...";
         }, 3000);
      },
      (errorMessage) => { /* ফ্রেম এরর ইগনোর */ }
    ).catch(err => {
       status.className = "status-msg text-danger";
       status.innerHTML = "❌ ক্যামেরা এরর: " + err;
       // ব্যাক ক্যামেরা ফেল করলে ড্রপডাউন অপশন দেখাবে
       showScannerWithSelector();
    });
  }

  function showScannerWithSelector() {
    if(html5QrCode) { html5QrCode.clear(); }
    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    scanner.render((text) => {
        let cleanNid = text.replace("NID:", "").trim();
        if (window.opener) {
          window.opener.postMessage({ type: 'QR_SCAN_SUCCESS', nid: cleanNid }, '*');
        }
    });
  }

  function restartScanner() {
    location.reload();
  }

  window.onload = startScanning;
</script>
</body>
</html>
