<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কিউআর কোড স্ক্যানার প্যানেল - জলঢাকা পৌরসভা</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f4f6f9; padding: 15px; }
        .scanner-card { background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px; max-width: 500px; margin: auto; border-top: 6px solid #004d40; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; border: none !important; }
        .status-box { font-size: 18px; font-weight: 700; border-radius: 12px; padding: 15px; text-align: center; margin-top: 15px; display: none; }
        .success-mode { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .error-mode { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        .info-mode { background-color: #e2e3e5; color: #383d41; border: 2px solid #d6d8db; }
        .btn-refresh { background-color: #00695c; color: white; border-radius: 12px; font-weight: bold; width: 100%; padding: 12px; margin-top: 15px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container mt-3">
    <div class="scanner-card text-center">
        <h3 class="text-success font-weight-bold mb-1">জলঢাকা পৌরসভা</h3>
        <p class="text-muted font-weight-bold mb-3">ভিজিএফ-২০২৬ দ্রুত বিতরণ স্ক্যানার</p>
        
        <div id="reader"></div>
        <div id="statusBox" class="status-box info-mode">ক্যামেরা চালু করার অনুমতি দিন...</div>
        <button id="restartBtn" onclick="startScanner()" class="btn-refresh" style="display:none;">আবার স্ক্যান করুন 🔄</button>
    </div>
</div>

<script>
    // আপনার গুগল অ্যাপস স্ক্রিপ্টের লাইভ ওয়েব অ্যাপ ইউআরএল
    const webAppUrl = "https://script.google.com/macros/s/AKfybyCBkPAQBN41bpGmOz0H4qlmFa8NCOT2TVx4DPHLCbK1z2VPMMHI5YXEl9gBYZZb7A/exec"; 
    
    let html5QrcodeScanner;
    let isProcessing = false;

    function startScanner() {
        document.getElementById("restartBtn").style.display = "none";
        showStatus("ক্যামেরা চালু হচ্ছে...", "info-mode");
        isProcessing = false;

        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length > 0) {
                let cameraId = devices[0].id;
                for (let i = 0; i < devices.length; i++) {
                    if (devices[i].label.toLowerCase().includes('back') || devices[i].label.toLowerCase().includes('environment')) {
                        cameraId = devices[i].id;
                        break;
                    }
                }
                
                if(html5QrcodeScanner) {
                    html5QrcodeScanner.clear().catch(err => console.log(err));
                }

                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    cameraId, 
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess,
                    onScanFailure
                ).then(() => {
                    showStatus("কার্ডের কিউআর কোড সামনে ধরুন...", "info-mode");
                }).catch(err => {
                    showStatus("ক্যামেরা চালু করা যায়নি: " + err, "error-mode");
                });
            } else {
                showStatus("কোনো ক্যামেরা পাওয়া যায়নি!", "error-mode");
            }
        }).catch(err => {
            showStatus("ক্যামেরা পারমিশন দিন এবং রিফ্রেশ করুন।", "error-mode");
        });
    }

    function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;
        
        html5QrcodeScanner.stop().catch(err => console.log(err));
        showStatus("সার্ভারে ডাটা আপডেট হচ্ছে, অপেক্ষা করুন...", "info-mode");

        let nid = decodedText.replace("NID:", "").trim();

        fetch(`${webAppUrl}?action=scanDistribute&nid=${nid}`)
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                showStatus(`✅ বিতরণ সফল!<br><b>নাম:</b> ${data.name}<br><b>ক্রমিক নং:</b> ${data.serial}`, "success-mode");
            } else if (data.status === "already_done") {
                showStatus(`⚠️ দুঃখিত!<br><b>${data.name}</b> ইতিপূর্বেই চাল নিয়েছেন।`, "error-mode");
            } else {
                showStatus("❌ এই কার্ডটি ডাটাবেজে পাওয়া যায়নি!", "error-mode");
            }
            document.getElementById("restartBtn").style.display = "block";
        })
        .catch(error => {
            showStatus("🌐 নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।", "error-mode");
            document.getElementById("restartBtn").style.display = "block";
        });
    }

    function onScanFailure(error) {
        // ফেইলিউর ইগনোর করা হলো স্পিড বৃদ্ধির জন্য
    }

    function showStatus(text, className) {
        const box = document.getElementById("statusBox");
        box.style.display = "block";
        box.className = "status-box " + className;
        box.innerHTML = text;
    }

    window.onload = startScanner;
</script>
</body>
</html>
